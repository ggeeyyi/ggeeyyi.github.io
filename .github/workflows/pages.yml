name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.second.outputs.page_url || steps.third.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare the site
        shell: bash
        run: |
          set -euo pipefail
          # The site is the repository's files as they are (no Jekyll).
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github
          echo "files: $(find _site -type f | wc -l), size: $(du -sh _site | cut -f1)"
      - name: Upload the Pages site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      # The deploy action lists this run's artifacts once, in the second the upload ended, and does not ask again:
      # when the artifact is not listed yet, or the Pages service answers with an error, the step fails although
      # the site is uploaded. So a failed try is followed by a wait and another try, three in all.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5.0.1
      - name: Wait before the second try
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (second try)
        id: second
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5.0.1
      - name: Wait before the third try
        if: steps.deployment.outcome == 'failure' && steps.second.outcome == 'failure'
        run: sleep 90
      - name: Deploy to GitHub Pages (third try)
        id: third
        if: steps.deployment.outcome == 'failure' && steps.second.outcome == 'failure'
        uses: actions/deploy-pages@v5.0.1
